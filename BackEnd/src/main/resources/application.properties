spring.application.name=BackEnd
server.port=8080
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.chat.model=${GEMINI_CHAT_MODEL:gemini-3.5-flash-lite}
spring.ai.google.genai.embedding.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.embedding.text.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
app.documents-directory=../documents
app.vectorstore-directory=../vectorstore
app.rag-top-k=5
app.rag-similarity-threshold=0.60
app.chunk-size=1100
app.chunk-overlap=180
